# Redirect wildcard subdomains to main domain
server {
    listen 443 ssl http2;
    server_name *.almftres.uisp.com;

    ssl_certificate /etc/letsencrypt/live/almftres.uisp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/almftres.uisp.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location / {
        return 301 https://almftres.uisp.com$request_uri;
    }
}
